name: Secretlint

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 4"

permissions:
  contents: read

jobs:
  secretlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          cache: npm

      - name: Tracked secret hygiene
        run: npm run check:tracked-secrets-hygiene

      - name: Secretlint
        run: npx --yes --package secretlint@8 --package @secretlint/secretlint-rule-preset-recommend@8 secretlint "**/*" --secretlintrc .secretlintrc.json
