name: QA secrets history scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 4"

permissions:
  contents: read

jobs:
  git_history_secret_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_HISTORY_SCAN_MAX_COMMITS: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          cache: npm

      - name: Git history secret exposure
        run: npm run check:git-history-secret-exposure
